name: sistema-email

services:

  php:
    build: .
    container_name: sistema-email_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html

  nginx:
    image: nginx:latest
    container_name: sistema-email_nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8091:80"
      - "8441:443"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "9432:1025"
      - "7653:8025"
    environment:
      MP_UI_AUTH: "jorge:123456789"

  mariadb:
    image: mariadb:latest
    container_name: sistema-email_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: 123456789
      MARIADB_DATABASE: laravel
      MARIADB_USER: jorge
      MARIADB_PASSWORD: 123456789
    ports:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: sistema-email_adminer
    restart: unless-stopped
    ports:
      - "8092:8080"

  mongodb:
    image: mongo:latest
    container_name: sistema-email_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: jorge
      MONGO_INITDB_ROOT_PASSWORD: 123456789
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: sistema-email_mongoexpress
    restart: unless-stopped
    ports:
      - "8093:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: jorge
      ME_CONFIG_MONGODB_ADMINPASSWORD: 123456789
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb

volumes:
  mariadb_data:
  mongo_data: